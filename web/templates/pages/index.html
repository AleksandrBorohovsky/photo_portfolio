{{ define "content" }}
    <h1 class="text-3xl font-bold">Добро пожаловать!</h1>
    <p>Это главная страница моего портфолио.</p>
    <div x-data="{ count: 0 }">
        <button @click="count++" class="bg-blue-500 px-4 py-2 text-white rounded">
            Нажали: <span x-text="count"></span> раз
        </button>
    </div>
{{ end }}
